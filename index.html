<style>
/* ============================= */
/* RESET GLOBAL & UTILS          */
/* ============================= */
* { box-sizing: border-box; -webkit-text-size-adjust: none; text-size-adjust: none; }
html { font-size: clamp(12px, 2.5vw, 16px); }
body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; }
.hidden { display: none !important; }

@media screen and (orientation: landscape) {
  html { transform: rotate(-90deg); transform-origin: left top; width: 100vh; height: 100vw; overflow-x: hidden; position: absolute; top: 100%; left: 0; }
}

#app-container { width: 100%; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

header { position: fixed; top: 0; left: 0; width: 100%; height: 85px; padding: 0 24px; padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; background: #000; border-bottom: 2px solid #18181b; z-index: 1000; }
.header-left { width: 33.333%; display: flex; flex-direction: column; justify-content: center; }
.header-center { width: 33.333%; display: flex; justify-content: center; align-items: center; gap: 16px; }
.header-right { width: 33.333%; display: flex; justify-content: end; align-items: center; }
.user-name { font-size: clamp(9px, 2.5vw, 12px); font-weight: 900; letter-spacing: 0.1em; color: #eaea00; text-transform: uppercase; line-height: 1.2; }
.user-id { font-size: clamp(12px, 3.5vw, 16px); font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.8); font-weight: bold; }

#stellantis-btn { position: fixed; bottom: 85px; left: 0; width: 100%; padding: 8px 32px; background: #000; border-top: 1px solid rgba(24, 24, 27, 0.5); z-index: 999; }
.footer-brand-btn { width: 100%; background: #eaea00; color: #000; padding: 24px 0; display: flex; align-items: center; justify-content: center; gap: 16px; border-radius: 16px; border: none; cursor: default; box-shadow: 0 10px 20px rgba(234, 234, 0, 0.15); }
.brand-text { font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.25rem; color: #000; }

nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: space-around; align-items: stretch; background: #000; border-top: 2px solid #18181b; z-index: 1000; }
.nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; width: 50%; height: 100%; cursor: pointer; }
.nav-text { font-size: clamp(10px, 2.5vw, 13px); font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
.active-nav { color: #eaea00 !important; border-top: 3px solid #eaea00; }

.view-section { position: fixed; top: 85px; bottom: 185px; left: 0; width: 100%; overflow: hidden; }
#view-scanner { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; overflow: hidden; background: #000 !important; }
.camera-container { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent !important; z-index: 1; }
#webcam, #webcam video { position: absolute; inset: 0; width: 100%; height: 90% !important; object-fit: cover; }
.scan-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; display: flex; align-items: center; justify-content: center; background: transparent !important; }
.scan-frame { position: relative; width: 85%; height: 530px; border: 0px solid rgba(5, 150, 105, 0.3); background: transparent; }
.scan-area { position: absolute; inset: 0; overflow: hidden; }
.corner { position: absolute; width: 24px; height: 24px; border: 3px solid #ffffff; z-index: 10; }
.top-l { top: -3px; left: -3px; border-right: none; border-bottom: none; }
.top-r { top: -3px; right: -3px; border-left: none; border-bottom: none; }
.bot-l { bottom: 93px; left: -3px; border-right: none; border-top: none; }
.bot-r { bottom: 93px; right: -3px; border-left: none; border-top: none; }
.scan-line { position: absolute; left: 0; width: 100%; height: 3px; background: #ffee00; box-shadow: 0 0 8px #ffee00, 0 0 16px #ffee00, 0 0 24px #ffee00; animation: laserMove 3s ease-in-out alternate infinite; }
.scan-line::before, .scan-line::after { content: ""; position: absolute; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 12px #ffee00, 0 0 24px #ffee00, 0 0 36px #ffee00; }
.scan-line::before { left: -2px; }
.scan-line::after { right: -2px; }
@keyframes laserMove { 0% { top: 0px; } 100% { top: calc(82% - 6px); } }

#view-history { overflow-y: auto !important; overflow-x: hidden !important; -webkit-overflow-scrolling: touch !important; padding: 8px; }
.table-toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; padding: 0 8px; }
@media (min-width: 360px) { .table-toolbar { flex-direction: row; justify-content: space-between; align-items: center; } }
.toolbar-left { display: flex; align-items: center; gap: 12px; }
.toolbar-right { display: flex; gap: 6px; flex-wrap: wrap; }
.flux-indicator { color: #eaea00; font-weight: 900; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; font-style: italic; margin: 0; }

.btn-action { border: none; padding: 6px 14px; font-weight: 900; font-size: 13px; text-transform: uppercase; font-style: italic; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: #000000 !important; transition: transform 0.1s, background-color 0.2s; }
.btn-action:active { transform: scale(0.95); }
.btn-yellow { background: #eaea00; } .btn-yellow:active { background: #c4c400; }
.btn-blue { background: #3b82f6; } .btn-blue:active { background: #2563eb; }
.btn-emerald { background: #10b981; } .btn-emerald:active { background: #059669; }
.btn-zinc { background: #a1a1aa; } .btn-zinc:active { background: #71717a; }

.search-container { padding: 0 12px; margin-bottom: 12px; }
.search-field { width: 100%; background: #27272a; border: 2px solid #3f3f46; border-radius: 12px; padding: 12px 16px; color: #fff; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; outline: none; font-size: 18px; text-align: center; transition: border-color 0.2s; }
.search-field:focus { border-color: #eaea00; }

.table-responsive { background: #111113; border-radius: 12px; overflow-x: auto; border: 2px solid #18181b; max-height: calc(100% - 100px); }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th { font-size: clamp(11px, 3vw, 14px); padding: 10px 8px; text-transform: uppercase; font-weight: 900; color: rgba(255,255,255,0.4); background: #27272a; position: sticky; top: 0; z-index: 10; text-align: center; }
.data-table tbody { font-family: 'JetBrains Mono', monospace; }
.data-table td { vertical-align: middle; padding: 12px 8px !important; border-bottom: 2px solid #18181b !important; text-align: center; }
.data-table td:first-child, .data-table th:first-child { position: sticky; left: 0; background: #18181b; z-index: 5; border-right: 2px solid #27272a; }
.data-table th:first-child { z-index: 15; background: #27272a; }

.cell-op { color: rgba(255, 255, 255, 0.3) !important; font-size: 16px !important; font-weight: 700; text-align: center; text-transform: uppercase; }
.code-text { font-size: 20px !important; font-weight: 900 !important; letter-spacing: 0.05em; text-align: center; text-transform: uppercase; }
.zone-text { font-size: 16px !important; font-weight: 700 !important; text-align: center; text-transform: uppercase; }
.cell-time { text-align: center; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.3; }
.time-display { font-size: 16px !important; font-weight: 900 !important; color: #ffffff; }
.status-success { font-size: 11px !important; font-weight: 800 !important; color: #22c55e !important; text-transform: uppercase; letter-spacing: 0.05em; }
.status-date { font-size: 11px !important; color: rgba(255, 255, 255, 0.2) !important; }
.sync-row { background: rgba(16, 185, 129, 0.02); }

.editable-cell { padding: 6px 12px; border-radius: 6px; transition: all 0.15s ease; display: inline-block; width: 100%; border: 2px solid transparent; text-align: center; }
.editable-cell:focus { outline: none; background: rgba(255, 68, 68, 0.05); border: 2px solid #ef4444; }
.cell-delete { width: 50px; text-align: center; }
.btn-delete { background: none; border: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; color: rgba(239, 68, 68, 0.3); font-size: 24px; font-weight: bold; border-radius: 50%; cursor: pointer; transition: color 0.2s; margin: 0 auto; }
.btn-delete:active { background: rgba(239, 68, 68, 0.2); }
.btn-delete:hover { color: #ef4444; }

.torch-btn { width: 52px; height: 52px; border: none; border-radius: 50%; background: #18181b; color: #ffffff; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .25s; }
.torch-btn:active { transform: scale(.92); }
.torch-btn.on { background: #ffee00; color: #000; box-shadow: 0 0 12px #ffee00, 0 0 24px #ffee00, 0 0 45px #ffee00; }

.auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; padding: 32px; display: flex; align-items: center; justify-content: center; }
.auth-box { width: 100%; max-width: 320px; text-align: center; }
.brand-title { color: #eaea00; font-weight: 900; font-size: 2.25rem; letter-spacing: -0.05em; margin-bottom: 8px; text-transform: uppercase; font-style: italic; }
.sub-title { color: #71717a; font-weight: bold; font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 32px; text-transform: uppercase; }
.form-group { display: flex; flex-direction: column; gap: 16px; }
.input-field { width: 100%; background: #18181b; border: 2px solid #27272a; padding: 16px; border-radius: 12px; outline: none; color: #fff; font-weight: bold; text-align: center; font-size: 1.25rem; transition: border-color 0.2s; }
.input-field:focus { border-color: #eaea00; }
.main-input { text-transform: uppercase; font-size: 1.5rem; padding: 20px; }
.btn-primary { width: 100%; margin-top: 16px; background: #eaea00; color: #000; font-weight: 900; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; }
.main-btn { padding: 24px 0; letter-spacing: 0.1em; font-size: 1.125rem; }
.link-btn { background: none; border: none; color: #71717a; text-decoration: underline; font-size: 1.125rem; text-transform: uppercase; font-weight: bold; margin-top: 16px; cursor: pointer; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: start; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal-content { background: #18181b; border: 2px solid #eaea00; border-radius: 32px; width: 100%; max-width: 280px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin-top: 10%; }
.modal-body { padding: 24px; }
.modal-title { color: #eaea00; font-size: 1.125rem; font-weight: 900; margin-bottom: 24px; letter-spacing: 0.05em; text-transform: uppercase; font-style: italic; text-align: center; }
.modal-input-container { position: relative; margin-bottom: 32px; }
.modal-input { width: 100%; background: #000; border: 2px solid #3f3f46; border-radius: 12px; padding: 20px 16px; font-size: 1.875rem; color: #fff; outline: none; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; text-align: center; }
.modal-input:focus { border-color: #eaea00; }
.modal-footer { display: flex; gap: 12px; height: 64px; }
.btn-modal-cancel { flex: 1; background: #27272a; color: #a1a1aa; border: none; font-size: 14px; font-weight: bold; border-radius: 12px; text-transform: uppercase; cursor: pointer; }
.btn-modal-confirm { flex: 1; background: #eaea00; color: #000; border: none; font-size: 14px; font-weight: bold; border-radius: 12px; text-transform: uppercase; cursor: pointer; }

.icon-btn { background: none; border: none; padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.icon-btn:active { background: #27272a; }
.icon-m { width: clamp(32px, 6vw, 36px); height: clamp(32px, 8vw, 38px); }
.icon-l { width: clamp(40px, 10vw, 48px); height: clamp(40px, 10vw, 48px); }
.text-scale { transition: transform 0.2s; }
.text-scale:hover { transform: scale(1.1); }

#debug-panel { position: fixed; top: 85px; right: 0; width: 280px; max-height: 60vh; overflow-y: auto; background: rgba(0,0,0,0.92); border: 1px solid #333; border-radius: 0 0 0 12px; z-index: 9999; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #eaea00; padding: 12px; display: none; }
#debug-panel.active { display: block; }
.debug-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.debug-label { color: #71717a; }
.debug-val { color: #eaea00; font-weight: 800; }

  #app-container, header, nav, #stellantis-btn, .view-section { max-width: 500px; left: 50%; transform: translateX(-50%); }

<body>
<div id="app-container">
  <div id="identity-screen" class="auth-screen">
    <div class="auth-box">
      <h1 class="brand-title">STELLANTIS</h1>
      <p id="auth-title" class="sub-title">Connexion Terminal</p>
      <div id="login-form" class="form-group">
        <input type="text" id="login-id" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" class="input-field main-input" placeholder="ID MATRICULE">
        <input type="password" id="login-pass" autocomplete="new-password" class="input-field main-input" placeholder="MOT DE PASSE">
        <button onclick="login()" class="btn-primary main-btn">Se Connecter</button>
        <button onclick="toggleAuth(true)" class="link-btn">Creer un compte</button>
      </div>
      <div id="signup-form" class="form-group hidden">
        <input type="text" id="reg-nom" class="input-field" placeholder="NOM">
        <input type="text" id="reg-prenom" class="input-field" placeholder="PRENOM">
        <input type="text" id="reg-id" class="input-field" placeholder="ID MATRICULE">
        <select id="reg-equipe" class="input-field">
          <option value="" disabled selected>EQUIPE</option>
          <option value="A">Equipe A</option>
          <option value="B">Equipe B</option>
          <option value="C">Equipe C</option>
          <option value="FER/A">Equipe FER/A</option>
          <option value="FER/B">Equipe Fer/B</option>
          <option value="FER/C">Equipe FER/C</option>
        </select>
        <input type="password" id="reg-pass" class="input-field" placeholder="MOT DE PASSE">
        <button onclick="register()" class="btn-primary main-btn">Valider</button>
        <button onclick="toggleAuth(false)" class="link-btn">Retour</button>
      </div>
    </div>
  </div>

  <header>
    <div class="header-left">
      <span id="display-name" class="user-name">---</span>
      <span id="display-id" class="user-id">ID: ---</span>
    </div>
    <div class="header-center">
      <button onclick="toggleTorch()" id="torch-btn" class="icon-btn torch-btn">🔦</button>
      <button onclick="toggleView('scanner')" class="icon-btn text-primary text-scale">
        <svg class="icon-l" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h3m-3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </button>
    </div>
    <div class="header-right">
      <button onclick="logoutIdentity()" class="icon-btn text-red">
        <svg class="icon-m" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-scanner" class="view-section">
      <div class="camera-container"><div id="webcam"></div></div>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="corner top-l"></div><div class="corner top-r"></div>
          <div class="corner bot-l"></div><div class="corner bot-r"></div>
          <div class="scan-line"></div>
        </div>
      </div>
    </section>

    <section id="view-history" class="view-section hidden">
      <div class="table-toolbar">
        <div class="toolbar-left"><h3 id="flux-title" class="flux-indicator">Flux (0)</h3></div>
        <div class="toolbar-right">
          <button onclick="toggleSearch()" id="search-btn" class="btn-action btn-yellow">
            <svg style="width:14px; height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Chercher
          </button>
          <button onclick="ajouterManuellement()" class="btn-action btn-blue">+ Manuel</button>
          <button onclick="syncAllLogs()" class="btn-action btn-emerald">Actualiser</button>
          <button onclick="exportCSV()" class="btn-action btn-zinc">CSV</button>
        </div>
      </div>
      <div id="search-bar" class="hidden search-container">
        <input type="text" id="search-input" placeholder="RECHERCHER UN VIS..."
               oninput="this.value = this.value.toUpperCase(); filtrerEnTempsReel(this.value)"
               autocomplete="off" autocorrect="off" spellcheck="false" class="search-field">
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead><tr><th>OP</th><th>Code</th><th>Zone</th><th>H/D</th><th>X</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
      <div id="stellantis-btn">
      <button class="footer-brand-btn" style="cursor: pointer;">
        <svg class="icon-m" fill="currentColor" viewBox="0 0 24 24"><path d="M3 4h2v16H3V4zm4 0h1v16H7V4zm3 0h3v16h-3V4zm5 0h2v16h-2V4zm4 0h2v16h-2V4zm4 0h2v16h-2V4z"/></svg>
        <span class="brand-text">STELLANTIS MGV</span>
      </button>
    </div>
  </main>

  <nav>
    <button onclick="toggleView('scanner')" id="nav-scanner" class="nav-item active-nav">
      <svg class="icon-m mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h3m-3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="nav-text">Scanner</span>
    </button>
    <button onclick="toggleView('history')" id="nav-history" class="nav-item text-muted">
      <svg class="icon-m mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7C5 4 4 5 4 7z"></path></svg>
      <span class="nav-text">Memoire</span>
    </button>
  </nav>
</div>

<div id="modal-saisie" class="modal-backdrop hidden">
  <div class="modal-content">
    <div class="modal-body">
      <h3 class="modal-title">SAISIE MANUELLE VIS</h3>
      <div class="modal-input-container">
        <input type="text" id="input-vis" class="modal-input" placeholder="EX: T5071035" oninput="this.value = this.value.toUpperCase()" autocapitalize="characters" autocomplete="off" spellcheck="false">

      <div class="modal-footer">
        <button onclick="fermerSaisie()" class="btn-modal-cancel">Annuler</button>

  <div class="debug-row"><span class="debug-label">Html5Qrcode Inst.</span><span class="debug-val" id="dbg-h5">0</span></div>
  <div class="debug-row"><span class="debug-label">Decodes/min</span><span class="debug-val" id="dbg-dps">0</span></div>

const VALID_PREFIXES = ['T51', 'V50', 'S50', 'S51', 'S512', 'S504', 'R50', 'M5', 'N5', 'P'];

function cleanAndValidateCode(rawCode) {
    if (rawCode === null || rawCode === undefined) return null;
    let code = String(rawCode).trim().toUpperCase().replace(/\s+/g, '');
    if (!code) return null;

    // Corrections OCR précises (VIS complet = 1 lettre + 7 chiffres uniquement)
    // Q51xxxx / F51xxxx / Z51xxxx -> T51xxxx
    if (/^[QFZ]51\d{5}$/.test(code)) code = 'T' + code.substring(1);
    // T58xxxx -> T51xxxx (ex. T5842331 -> T5142331) : "1" lu comme "8". T58 n'est PAS un préfixe valide.
    if (/^T58\d{5}$/.test(code)) code = 'T51' + code.substring(3);

    // Format : 1 lettre + 7 chiffres
    if (!/^[A-Z][0-9]{7}$/.test(code)) return null;
    // Préfixe autorisé
    if (!VALID_PREFIXES.some(prefix => code.startsWith(prefix))) return null;
    return code;
}

function onBarcodeDetected(code) {
    if (AppState.scanLocked) return;
    const cleanCode = cleanAndValidateCode(code);
    if (!cleanCode) return;
    AppState.scanLocked = true;
    playScanSound();
    addLogEntry(cleanCode);
    setTimeout(() => { AppState.scanLocked = false; }, 1500);
}

function playScanSound() {
    try {
        if (!AppState.audioCtx) AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = AppState.audioCtx.createOscillator();
        const gain = AppState.audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, AppState.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, AppState.audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(AppState.audioCtx.destination);
        osc.start();
        osc.stop(AppState.audioCtx.currentTime + 0.1);
    } catch (e) { logError('Audio: ' + e.message); }
}

// ==========================================
// RÉSEAU : appels Supabase protégés (timeout + erreurs réseau normalisées)
// ==========================================
function isNetErr(err) {
    if (!err) return false;
    if (err.isNet) return true;
    return !err.code && /fetch|network|timeout|load failed|abort|offline/i.test(err.message || '');
}
async function netCall(builder) {
    try {
        const res = await Promise.race([
            Promise.resolve(builder),
            new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), NET_TIMEOUT_MS))
        ]);
        if (res && res.error && isNetErr(res.error)) return { data: null, error: { isNet: true, message: res.error.message } };
        return res || { data: null, error: { isNet: true, message: 'empty response' } };
    } catch (e) {
        return { data: null, error: { isNet: true, message: e.message } };
    }
}
function canTry() { return navigator.onLine && !!getClient(); }

// ==========================================
// STOCKAGE LOCAL (localStorage, clé inchangée : SCAN_MGV_APP)
// ==========================================
function newLocalId() { return 'local_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
    function parseTs(l) {
    const m = /^(\d{2})\/(\d{2})\/(\d{2,4})$/.exec(l.date || '');
    const t = /^(\d{2}):(\d{2}):(\d{2})$/.exec(l.time || '');
    if (!m) return 0;
    let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1], t ? +t[1] : 0, t ? +t[2] : 0, t ? +t[3] : 0).getTime();
}

// Migration non destructive des anciennes lignes (id unique) -> _localId / _supabaseId
function normalizeLog(l) {
    if (!l || typeof l !== 'object') return null;
    if (!l._localId) {
        const legacy = l.id;
        l._localId = (legacy !== undefined && legacy !== null) ? 'local_' + legacy : newLocalId();
        if (l.synced) { l._supabaseId = (legacy !== undefined ? legacy : null); }
        else { l._supabaseId = null; if (legacy && legacy > 1e11) l._legacyId = legacy; } // vérifié côté serveur avant tout INSERT
    }
    if (l._supabaseId === undefined) l._supabaseId = null;
    delete l.id;
    l.code = l.code || ''; l.zone = l.zone || ''; l.op = l.op || ''; l.synced = !!l.synced; l._rev = l._rev || 0;
    if (!l._created) l._created = parseTs(l);
    return l;
}

function loadLogs() {
    let arr = [];

    if (!Array.isArray(arr)) arr = [];
    const seen = new Set();
    AppState.logs = arr.map(normalizeLog).filter(l => l && !seen.has(l._localId) && seen.add(l._localId));
    saveLogs();
}

function saveLogs() {
    try { localStorage.setItem(LOGS_KEY, JSON.stringify(AppState.logs)); }

}

function getPendingDeletes() {
    try {
        const raw = JSON.parse(localStorage.getItem(PENDING_DELETES_KEY) || '[]');
        return (Array.isArray(raw) ? raw : []).map(p => ({
            _localId: p._localId || ('local_' + p.id),
            _supabaseId: p._supabaseId !== undefined ? p._supabaseId : (p.id !== undefined ? p.id : null),

    } catch (e) { return []; }
}
function savePendingDeletes(list) {
    try { localStorage.setItem(PENDING_DELETES_KEY, JSON.stringify(list)); } catch (e) { logError('Stockage suppressions: ' + e.message); }
}
function queuePendingDelete(localId, supabaseId, deletedBy) {
    const list = getPendingDeletes().filter(p => p._localId !== localId);
    list.push({ _localId: localId, _supabaseId: supabaseId, deleted_by: deletedBy, deleted_at: new Date().toISOString() });
    savePendingDeletes(list);
}

function nettoyerAnciennesDonnees7Jours() {

        const ts = parseTs(log) || log._created;
        return !ts || (now - ts) < limite;
    });
}

async function validateAndSendZone(localId, val, el) {

    const l = AppState.logs.find(x => x._localId === localId);
    if (!l || !zoneValue) return;
    if (el) el.innerText = zoneValue;
    if (zoneValue === l.zone && l.synced) return;
    l.zone = zoneValue;
    l.synced = false; l._rev++;

    patchStatuses();
    requestSync();
}

async function updateEntry(localId, field, val, el) {
    const l = AppState.logs.find(x => x._localId === localId);
    if (!l) return;
    let newVal = String(val || '').trim().toUpperCase();
    if (field === 'code') {
        const valid = cleanAndValidateCode(newVal);
        if (!valid) { alert("Format invalide !"); renderTable(); return; }
        newVal = valid;
    }
    if (el) el.innerText = newVal;
    if (newVal === (l[field] || '')) return;
    l[field] = newVal;
    l.synced = false; l._rev++;
    saveLogs();
    patchStatuses();
    requestSync();
}

async function deleteEntry(localId) {
    if (!confirm("Supprimer l'entrée ?")) return;
    const user = getUser() || { id: 'TEMP' };
    const entry = AppState.logs.find(l => l._localId === localId);
    if (!entry) return;
    console.log(`[DELETE] _localId = ${localId} | _supabaseId = ${entry._supabaseId} | LOCAL = supprimé`);

    AppState.logs = AppState.logs.filter(l => l._localId !== localId);
    saveLogs();
    renderTable();

    const sid = entry._supabaseId || entry._legacyId || null;
    // On garde une trace de suppression si la ligne existe (ou peut exister) côté serveur, ou si son INSERT est en cours
    if (sid || _inFlight.has(localId)) {
        queuePendingDelete(localId, sid, user.id);
        requestSync();
    }
}

// ==========================================
// SYNCHRONISATION (déclenchée par événements uniquement, pas de timer)
// Ordre : suppressions -> INSERT -> UPDATE -> lecture serveur + fusion
// ==========================================
const _inFlight = new Set();
let _syncRunning = false, _syncAgain = false, _wantFetch = false, _syncPromise = null;

function requestSync(wantFetch) {
    if (wantFetch) _wantFetch = true;
    if (_syncRunning) { _syncAgain = true; return _syncPromise; }
    _syncRunning = true;
    _syncPromise = (async () => {
        try {
            do {
                _syncAgain = false;
                const f = _wantFetch; _wantFetch = false;
                await syncCycle(f);
            } while (_syncAgain);
        } catch (e) { logError('Sync: ' + e.message); }
        finally { _syncRunning = false; refreshUI(); }
    })();
    return _syncPromise;
}

async function syncCycle(withFetch) {
    if (!canTry()) return;
    let ok = await flushPendingDeletes();
    if (ok) ok = await resolveLegacy();
    if (ok) ok = await pushInserts();
    if (ok) ok = await pushUpdates();
    if (ok && withFetch) await fetchLogsFromSupabase();
}

async function flushPendingDeletes() {
    const client = getClient();
    const pending = getPendingDeletes();
    if (pending.length === 0) return true;
    const still = [];
    let ok = true;
    for (let i = 0; i < pending.length; i++) {
        const p = pending[i];
        if (!p._supabaseId) { if (_inFlight.has(p._localId)) still.push(p); continue; } // jamais parti côté serveur
        if (!ok) { still.push(p); continue; }
        const { error } = await netCall(client.from(TABLE).update({ is_deleted: true, deleted_at: p.deleted_at, deleted_by: p.deleted_by }).eq('id', p._supabaseId));
        if (error) { still.push(p); if (isNetErr(error)) ok = false; else logError('Soft delete: ' + error.message); }
        else console.log(`[SYNC] soft-delete OK _supabaseId = ${p._supabaseId}`);
    }
    savePendingDeletes(still);
    return ok;
}

// Anciennes lignes non synchronisées : vérifier si leur ancien id existe déjà côté serveur
async function resolveLegacy() {
    const legacy = AppState.logs.filter(l => !l._supabaseId && l._legacyId);
    if (legacy.length === 0) return true;
    const { data, error } = await netCall(getClient().from(TABLE).select('id').in('id', legacy.map(l => l._legacyId)));
    if (error) return !isNetErr(error);
    const found = new Set((data || []).map(r => r.id));
    legacy.forEach(l => { if (found.has(l._legacyId)) l._supabaseId = l._legacyId; delete l._legacyId; });
    saveLogs();
    return true;
}

async function pushInserts() {
    const client = getClient();
    const targets = AppState.logs.filter(l => !l.synced && !l._supabaseId);
    for (const l of targets) {
        if (!AppState.logs.includes(l)) continue;
        const rev = l._rev;
        _inFlight.add(l._localId);
        const { data, error } = await netCall(client.from(TABLE).insert([{
            operator_id: l.op, op: l.op, equipe_id: l.equipe_id, code: l.code, zone: l.zone, date: l.date, time: l.time
        }]).select('id').single());
        _inFlight.delete(l._localId);
        if (error) {
            if (isNetErr(error)) return false; // réseau coupé : la ligne reste en attente
            logError('INSERT: ' + error.message); continue;
        }
        if (AppState.logs.includes(l)) {
            l._supabaseId = data.id;
            if (l._rev === rev) l.synced = true; // sinon un UPDATE partira au prochain tour
            else _syncAgain = true;
            saveLogs();
            console.log(`[SYNC] INSERT OK _localId = ${l._localId} -> _supabaseId = ${data.id}`);
        } else {
            // supprimée pendant l'INSERT : on transmet le vrai id à la file de suppression
            const p = getPendingDeletes();
            const it = p.find(x => x._localId === l._localId);
            if (it) { it._supabaseId = data.id; savePendingDeletes(p); }
            else { const u = getUser() || { id: 'TEMP' }; queuePendingDelete(l._localId, data.id, u.id); }
            _syncAgain = true;
        }
    }
    return true;
}

async function pushUpdates() {
    const client = getClient();
    const targets = AppState.logs.filter(l => !l.synced && l._supabaseId);
    for (const l of targets) {
        if (!AppState.logs.includes(l)) continue;
        const rev = l._rev;
        const { error } = await netCall(client.from(TABLE).update({ code: l.code, zone: l.zone, equipe_id: l.equipe_id, date: l.date, time: l.time }).eq('id', l._supabaseId));
        if (error) {
            if (isNetErr(error)) return false;
            logError('UPDATE: ' + error.message); continue;
        }
        if (l._rev === rev) { l.synced = true; saveLogs(); } else _syncAgain = true;
        console.log(`[SYNC] UPDATE OK _supabaseId = ${l._supabaseId}`);
    }
    return true;
}

// Lecture serveur + FUSION (ne jamais écraser les lignes locales en attente)
async function fetchLogsFromSupabase() {
    if (!canTry()) return false;
    const user = getUser();
    if (!user) return false;
    const { data, error } = await netCall(getClient().from(TABLE).select('*').eq('op', user.id).eq('is_deleted', false).order('id', { ascending: false }));
    if (error) { if (!isNetErr(error)) logError('Fetch: ' + error.message); return false; }

    const pendDel = new Set(getPendingDeletes().map(p => p._supabaseId).filter(Boolean));
    const bySid = new Map();
    AppState.logs.forEach(l => { if (l._supabaseId) bySid.set(l._supabaseId, l); });

    const serverSids = new Set();
    const merged = [];
    for (const row of data) {
        if (pendDel.has(row.id)) continue;
        serverSids.add(row.id);
        const loc = bySid.get(row.id);
        if (loc && !loc.synced) continue; // modification locale en attente : on la garde
        merged.push(serverToLocal(row, loc));
    }
    const truncated = data.length >= 1000;
    AppState.logs.forEach(l => {
        if (!l.synced) merged.push(l);                                            // en attente : conservée
        else if (l._supabaseId && !serverSids.has(l._supabaseId) && truncated) merged.push(l); // liste serveur tronquée
        // synced + absente du serveur = supprimée ailleurs -> retirée
    });
    AppState.logs = merged;
    sortLogs();
    nettoyerAnciennesDonnees7Jours();
    saveLogs();
    return true;
}

async function syncAllLogs() {
    if (!navigator.onLine) return alert("Vous êtes hors-ligne.");
    if (!getClient()) return alert("Librairie de synchronisation indisponible.");
    const before = AppState.logs.filter(l => !l.synced).length + getPendingDeletes().length;
    await requestSync(true);
    const after = AppState.logs.filter(l => !l.synced).length + getPendingDeletes().length;
    if (before === 0) return alert("Aucune donnée à synchroniser.");
    if (after > 0) return alert(`Synchronisé : ${before - after} élément(s). ${after} en attente (réseau ?).`);
    alert(`Synchronisé : ${before} élément(s).`);
}

// ==========================================
// REALTIME (un seul channel, recréé proprement au retour réseau)
// ==========================================
function ensureRealtime() {
    const client = getClient(), user = getUser();
    if (!client || !user || !navigator.onLine) return;
    if (AppState.rtChannel) {
        const st = AppState.rtChannel.state;
        if (st === 'joined' || st === 'joining') return;
        try { client.removeChannel(AppState.rtChannel); } catch (e) {}
        AppState.rtChannel = null;
    }
    try {
        AppState.rtChannel = client.channel('table-db-changes-' + user.id)
            .on('postgres_changes', { event: '*', schema: 'public', table: TABLE, filter: `op=eq.${user.id}` }, handleRealtime)
            .subscribe();
    } catch (e) { logError('Realtime: ' + e.message); AppState.rtChannel = null; }
}

function handleRealtime(payload) {
    const user = getUser();
    const rowOp = (payload.new && payload.new.op) || (payload.old && payload.old.op);
    if (user && user.id && rowOp && rowOp !== user.id) return;
    const pendDel = new Set(getPendingDeletes().map(p => p._supabaseId).filter(Boolean));

    if (payload.eventType === 'INSERT') {
        const n = payload.new;
        if (n.is_deleted || pendDel.has(n.id)) return;
        if (AppState.logs.some(l => l._supabaseId === n.id)) return;
        if (AppState.logs.some(l => !l._supabaseId && _inFlight.has(l._localId) && l.op === n.op && l.date === n.date && l.time === n.time)) return; // écho de notre propre INSERT
        AppState.logs.unshift(serverToLocal(n));
    } else if (payload.eventType === 'UPDATE') {
        const n = payload.new;
        if (n.is_deleted) {
            AppState.logs = AppState.logs.filter(l => l._supabaseId !== n.id);
        } else if (!pendDel.has(n.id)) {
            const idx = AppState.logs.findIndex(l => l._supabaseId === n.id);
            if (idx !== -1) { if (AppState.logs[idx].synced) AppState.logs[idx] = serverToLocal(n, AppState.logs[idx]); }
            else AppState.logs.unshift(serverToLocal(n));
        }
    } else if (payload.eventType === 'DELETE') {
        AppState.logs = AppState.logs.filter(l => l._supabaseId !== payload.old.id);
    }
    sortLogs();
    saveLogs();
    refreshUI();
}

// EVENTS RÉSEAU

window.addEventListener('online', () => {
    AppState.isOnline = true;
    updateDebugPanel();
    console.log('[NETWORK] Connexion rétablie.');
    ensureRealtime();
    requestSync(true);
});
window.addEventListener('offline', () => {
    AppState.isOnline = false;
    updateDebugPanel();
    console.log('[NETWORK] Mode hors-ligne.');
});

// ==========================================
// AFFICHAGE
// ==========================================
function isEditing() {
    const a = document.activeElement;
    return !!(a && a.classList && a.classList.contains('editable-cell'));
}
function refreshUI() { if (isEditing()) patchStatuses(); else renderTable(); }

function statusHtml(log, check) {
    const statusText = log.synced ? 'SUCCESS' : log.date;
    const statusClass = log.synced ? 'status-success' : 'status-date';
    return `<div class="${statusClass}">${escapeHtml(statusText)}${(check && log.synced) ? ' &#10003;' : ''}</div>`;
}

// Met à jour uniquement les statuts (sans détruire la cellule en cours d'édition)
function patchStatuses() {
    AppState.logs.forEach(log => {
        const st = document.getElementById(`st-${log._localId}`);
        if (st) st.innerHTML = statusHtml(log, true);
        const row = document.getElementById(`row-${log._localId}`);
        if (row) row.classList.toggle('sync-row', !!log.synced);
    });
    const titleEl = document.getElementById('flux-title');
    if (titleEl) titleEl.innerText = `Flux (${AppState.logs.length})`;
}

function rowHtml(log, opts) {
    const id = escapeHtml(log._localId);
    const rowAttr = opts.style ? `style="${opts.style}"` : `class="${log.synced ? 'sync-row' : ''}"`;
    return `
        <tr id="row-${id}" ${rowAttr}>
            <td class="cell-op">${escapeHtml(log.op)}${log.equipe_id ? '/' + escapeHtml(log.equipe_id) : ''}</td>
            <td class="cell-code">
                <div class="editable-cell text-primary code-text" contenteditable="true" onblur="updateEntry('${id}', 'code', this.innerText, this)">${escapeHtml(log.code)}</div>
            </td>
            <td class="cell-zone">
                <div class="editable-cell text-white zone-text zone-input" contenteditable="true" onblur="validateAndSendZone('${id}', this.innerText, this)" onkeypress="if(event.key === 'Enter'){ event.preventDefault(); this.blur(); }">${escapeHtml(log.zone)}</div>
            </td>
            <td class="cell-time">
                <div class="time-display">${escapeHtml(log.time)}</div>
                <div id="st-${id}">${statusHtml(log, opts.check)}</div>
            </td>
            <td class="cell-delete">
                <button onclick="deleteEntry('${id}')" class="btn-delete">&times;</button>
            </td>
        </tr>`;
}

function renderTable() {
    const titleEl = document.getElementById('flux-title');
    if (titleEl) titleEl.innerText = `Flux (${AppState.logs.length})`;
    const historyBody = document.getElementById('history-body');
    if (!historyBody) return;
    historyBody.innerHTML = AppState.logs.map(log => rowHtml(log, { check: true })).join('');
}

function filtrerEnTempsReel(query) {
    const q = query.trim().toUpperCase();
    if (!q) { renderTable(); return; }
    const historyBody = document.getElementById('history-body');
    historyBody.innerHTML = AppState.logs.map(log => {
        const isMatch = (log.code || '').includes(q) || (log.zone || '').includes(q) || (log.op || '').includes(q);
        return rowHtml(log, { check: false, style: isMatch ? 'background:rgba(234,234,0,0.25);' : 'opacity:0.3' });
    }).join('');
}

function toggleView(v) {
    if (AppState.isTransitioning) return;
    AppState.currentView = v;
    document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
    document.querySelectorAll('nav button').forEach(b => { b.classList.add('text-muted'); b.classList.remove('active-nav'); });
    const targetView = document.getElementById(`view-${v}`);
    if (targetView) targetView.classList.remove('hidden');
    const targetNav = document.getElementById(`nav-${v}`);
    if (targetNav) targetNav.classList.add('active-nav');
    if (v === 'scanner') startNativeCamera(); else stopNativeCamera();
}
    function ajouterManuellement() {
    const input = document.getElementById('input-vis');
    input.value = "";
    document.getElementById('modal-saisie').classList.remove('hidden');
    setTimeout(() => input.focus(), 100);
}
function fermerSaisie() { document.getElementById('modal-saisie').classList.add('hidden'); }

function validerSaisie() {
    const codeClean = cleanAndValidateCode(document.getElementById('input-vis').value);
    if (codeClean) {
        playScanSound();
        addLogEntry(codeClean);
        fermerSaisie();
    } else {
        alert("Format invalide !");
    }
}

function toggleSearch() {
    const bar = document.getElementById('search-bar');
    const input = document.getElementById('search-input');
    if (bar.classList.contains('hidden')) {
        bar.classList.remove('hidden');
        setTimeout(() => input.focus(), 100);
    } else {
        bar.classList.add('hidden');
        input.value = '';
        renderTable();
    }
}

function exportCSV() {
    if (AppState.logs.length === 0) return alert("Aucune donnée.");
    let csv = "OP;EQUIPE;CODE VIS;ZONE;DATE;HEURE;STATUT\n";
    AppState.logs.forEach(l => {
        csv += `${l.op};${l.equipe_id || ''};${l.code};${l.zone};${l.date};${l.time};${l.synced ? 'ENVOYE' : 'ATTENTE'}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `STELLANTIS_MGV.csv`;
    link.click();
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopNativeCamera();
    } else {
        if (AppState.currentView === 'scanner') setTimeout(() => startNativeCamera(), 300);
        if (navigator.onLine && getUser()) { ensureRealtime(); requestSync(false); }
    }
});

async function logoutIdentity() {
    if (confirm("Voulez-vous vous déconnecter du terminal ?")) {
        await clearAllResources();
        localStorage.removeItem('StellantisUser');
        location.reload();
    }
}

function buildFullOperatorId(id, equipeId) {
    if (!id) return '';
    return equipeId ? `${id}/${equipeId}` : `${id}`;
}

// ==========================================
// DÉMARRAGE
// ==========================================
async function initApp() {
    lockOrientation();
    loadLogs();
    nettoyerAnciennesDonnees7Jours();
    saveLogs();

    const user = getUser();
    AppState.user = user;
    if (user) {
        document.getElementById('identity-screen').classList.add('hidden');
        document.getElementById('display-name').innerText = (user.prenom || '') + " " + (user.nom || '');
        document.getElementById('display-id').innerText = `ID: ${buildFullOperatorId(user.id, user.equipe_id)}`;
        renderTable();      // affichage immédiat depuis le stockage local (marche hors ligne)
        startNativeCamera();
        if (navigator.onLine) {
            waitFor(() => !!getClient(), 5000).then(() => { ensureRealtime(); requestSync(true); });
        }
    }
    // Sans utilisateur enregistré : l'écran de connexion reste affiché (connexion hors ligne via le cache des comptes déjà validés en ligne)

    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
initApp();

document.getElementById('stellantis-btn')?.addEventListener('click', () => { toggleDebug(); });

// ==========================================
// SERVICE WORKER (une erreur ici ne bloque jamais l'application)
// ==========================================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        try {
            navigator.serviceWorker.register('./service-worker.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    if (!nw) return;
                    nw.addEventListener('statechange', () => {
                        // Nouvelle version installée : appliquée à la prochaine ouverture, aucun rechargement forcé
                        if (nw.state === 'installed' && navigator.serviceWorker.controller) console.log('[SW] Nouvelle version prête (prochaine ouverture).');
                    });
                });
            }).catch(e => logError('Service Worker: ' + e.message));
        } catch (e) { logError('Service Worker: ' + e.message); }
    });
}
