        /* ==========================================================================
   CENTRAGE PARFAIT ET SYMÉTRIQUE DU CADRE BLANC

}

    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important; /* Calage mathématique au pixel près */

}

<script>
// 1. CONFIGURATION INTEGRATION SUPABASE DIRECTE
const SUPABASE_URL = "https://rdhmsbqhjlmtlgrjuyxa.supabase.co"; // حط الرابط ديالك هنا
const SUPABASE_ANON_KEY = "sb_publishable_S_NgVByTSPeH1ZE7DTSTAg_3yAoRQSK"; // المفتاح الجديد ديالك

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
console.log("▲ Supabase connecté avec succès (Mode: INSERT ONLY)");

// 2. دالة إرسال سكاّن جديد (INSERT)
async function sendRecordToSupabase(record) {
    if (!record.scan_id) {
        record.scan_id = crypto.randomUUID();
    }

    // تنسيق التاريخ والوقت بناءً على الـ timestamp الخاص بالسكّان
    const scanDate = new Date(record.timestamp);
    const formattedDate = record.date || scanDate.toLocaleDateString('fr-FR'); // DD/MM/YY
    const formattedTime = record.time || scanDate.toLocaleTimeString('fr-FR'); // HH:MM:SS

    try {
        const { error } = await supabaseClient
            .from('scans')
            .insert([{
                scan_id:    record.scan_id,
                op:         record.op,          // ID Matricule opérateur
                code:       record.codeVis,     // Code VIS scanné
                zone:       record.zone || '',  // Zone de production
                date:       formattedDate,      // DD/MM/YY
                time:       formattedTime,      // HH:MM:SS
                created_at: scanDate.toISOString()
            }]);

        if (error) {
            // إذا كان السكّان ديجا تصيفط (Doublon)، كنرجعو true باش يتحيد من الـ LocalStorage وميبقاش يتعاود
            if (error.code === '23505') { 
                console.warn(`▲ Scan doublon ignoré de manière sécurisée (scan_id: ${record.scan_id})`);
                return true; 
            }
            throw error;
        }
        
        console.log(`▲ Scan envoyé avec succès à Supabase (CODE: ${record.codeVis})`);
        return true;
    } catch (err) {
        console.error("▲ Erreur sync Supabase :", err);
        return false;
    }
}

// 3. نظام المزامنة التلقائية عند عودة الإنترنت (Offline Sync)
async function syncPendingSupabaseScans() {
    if (!navigator.onLine) return;
    
    let pendingSupabaseSync = [];
    const savedPending = localStorage.getItem('pendingSupabaseSync');
    if (savedPending) {
        pendingSupabaseSync = JSON.parse(savedPending);
    }
    if (pendingSupabaseSync.length === 0) return;
    
    console.log(`▲ Traitement batch Supabase : ${pendingSupabaseSync.length} scan(s) en attente.`);
    const remainingToSync = [];
    
    for (const record of pendingSupabaseSync) {
        const success = await sendRecordToSupabase(record);
        if (!success) remainingToSync.push(record);
    }
    
    localStorage.setItem('pendingSupabaseSync', JSON.stringify(remainingToSync));
    console.log("▲ Sync Supabase terminé. Reste en attente :", remainingToSync.length);
}

// تفعيل المزامنة التلقائية فور عودة اتصال الهاتف بالإنترنت
window.addEventListener('online', syncPendingSupabaseScans);
</script>
<script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwsFDUIgEsiQRo1R2HIiu1cGi-wH_wdJqmF4uTw5iOkGfWxJdpab96XZRurb6MP0L4/exec";
    let isProcessing = false;
    let lastScannedCode = "";
    let lastScanTime = 0;
    let logs = JSON.parse(localStorage.getItem('lumen_logs')) || [];
    let audioCtx = null;
    let html5Instance = null;
    let torchEnabled = false; // Correction structurelle du pointeur d'état global du flash

    function initApp() {
    purgerAnciensLogs(15);

    const user = JSON.parse(localStorage.getItem('StellantisUser'));

    if (user) {

        document.getElementById('identity-screen').classList.add('hidden');

        document.getElementById('display-name').innerText =
            user.prenom + " " + user.nom;

        document.getElementById('display-id').innerText =
            `ID: ${user.id}`;

        renderTable();

        // ✅ Synchronisation automatique Supabase au démarrage
        if (navigator.onLine) {
            syncPendingScans();
        }

        startLibraryScanner();

    } else if (!navigator.onLine) {

        localStorage.setItem('StellantisUser', JSON.stringify({
            id: 'TEMP',
            nom: 'HORS-LIGNE',
            prenom: 'MODE'
        }));

        document.getElementById('identity-screen').classList.add('hidden');

        document.getElementById('display-name').innerText =
            "MODE HORS-LIGNE";

        document.getElementById('display-id').innerText =
            "ID: TEMP";

        renderTable();

        // ✅ Tentative sync si réseau revient juste après ouverture
        if (navigator.onLine) {
            syncPendingScans();
        }

        startLibraryScanner();
    }
}

    function purgerAnciensLogs(jours) {
        const limiteTemps = jours * 24 * 60 * 60 * 1000; 
        const maintenant = Date.now();
        const logsFiltres = logs.filter(log => (maintenant - log.id) < limiteTemps);
        if (logsFiltres.length !== logs.length) {
            logs = logsFiltres;
            localStorage.setItem('lumen_logs', JSON.stringify(logs));
        }
    }

    async function startLibraryScanner() {
        if (html5Instance) return;

        html5Instance = new Html5Qrcode("interactive-reader");
        const config = {
            fps: 20, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                return {
                    width: Math.floor(viewfinderWidth * 0.90),
            height: Math.floor(viewfinderHeight * 0.6)
                };
            }
        };

        try {
            await html5Instance.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    const now = Date.now();
                    const cleanCode = decodedText.trim().toUpperCase();

                    if (isProcessing) return;
                    if (cleanCode === lastScannedCode && (now - lastScanTime) < 2500) return; 

                    if (/^[A-Z][0-9]{7}$/.test(cleanCode)) {
                        isProcessing = true; 
                        lastScannedCode = cleanCode;
                        lastScanTime = now;

                        playScanSound();
                        addLogEntry(cleanCode);
                    }
                },
                (errorMessage) => {}
            );

         } catch (err) {
            console.error("Erreur d'accès caméra :", err);
        }
    }

    async function stopLibraryScanner() {
        if (html5Instance) {
            try {
                await html5Instance.stop();
                html5Instance = null;
            } catch (err) {
                console.error("Erreur d'arrêt du scanneur :", err);
            }
        }
    }

    async function toggleTorch() {
        if (!html5Instance) return alert("Scanneur inactif.");
        try {
            const videoEl = document.querySelector('#interactive-reader video');
            if (!videoEl || !videoEl.srcObject) return alert("Flux vidéo introuvable.");

            const track = videoEl.srcObject.getVideoTracks()[0];
            if (!track) return alert("Piste vidéo introuvable.");

            const capabilities = track.getCapabilities();
            if (!capabilities?.torch) return alert("Flash non disponible sur cette caméra.");

            const newState = !torchEnabled;
            await track.applyConstraints({ advanced: [{ torch: newState }] });

            torchEnabled = newState;
            updateTorchBtn();

        } catch(e) {
            torchEnabled = false;
            updateTorchBtn();
            alert("Erreur flash : " + e.message);
        }
    }

    function updateTorchBtn() {
      const btn = document.getElementById('torch-btn');
        const svg = btn.querySelector('svg');
        if (torchEnabled) {
            btn.style.background = '#eaea00';
            btn.style.boxShadow = '0 0 12px rgba(234,234,0,0.6)';
            svg.style.color = '#000';
        } else {
            btn.style.background = '';
            btn.style.boxShadow = '';
            svg.style.color = '';
        }
    }

    async function login() {
        const id = document.getElementById('login-id').value.trim().toUpperCase();
        const pass = document.getElementById('login-pass').value;
        if (!id || !pass) return alert("REMPLIR TOUS LES CHAMPS");

        if (!navigator.onLine) {
            const cachedUsers = JSON.parse(localStorage.getItem('StellantisUsers_cache') || '[]');
            const found = cachedUsers.find(u => u.id === id && u.pass === pass);
            if (found) {
                localStorage.setItem('StellantisUser', JSON.stringify({ id: found.id, nom: found.nom, prenom: found.prenom }));
                initApp();
            } else { alert("❌ Identifiants incorrects (hors-ligne)."); }
            return;
        }

        try {
            const res = await fetch(`${GOOGLE_URL}?action=login&id=${id}&pass=${pass}`);
            const data = await res.json();
            if (data.status === 'active') {
                let cachedUsers = JSON.parse(localStorage.getItem('StellantisUsers_cache') || '[]');
                cachedUsers = cachedUsers.filter(u => u.id !== id);
                cachedUsers.push({ id, pass, nom: data.nom, prenom: data.prenom });
                localStorage.setItem('StellantisUsers_cache', JSON.stringify(cachedUsers));
                localStorage.setItem('StellantisUser', JSON.stringify({ id: id, nom: data.nom, prenom: data.prenom }));
                location.reload();
            } else { alert("❌ Accès refusé ou erroné."); }
        } catch(e) { alert("⚠️ Erreur serveur."); }
    }

    async function register() {
        const n = document.getElementById('reg-nom').value.trim().toUpperCase();
        const p = document.getElementById('reg-prenom').value.trim().toUpperCase();
        const i = document.getElementById('reg-id').value.trim().toUpperCase();
        const pass = document.getElementById('reg-pass').value;
        if (!n || !p || !i || !pass) return alert("CHAMPS OBLIGATOIRES");
        try {
            const res = await fetch(`${GOOGLE_URL}?action=register&nom=${n}&prenom=${p}&id=${i}&pass=${pass}`);
            const data = await res.json();
            if (data.status === "success") { alert("COMPTE CRÉÉ !"); toggleAuth(false); }
            else if (data.status === "exists") alert("ID EXISTE DÉJÀ");
        } catch(e) { alert("ERREUR SERVEUR"); }
    }

    function toggleAuth(showSignup) {
        document.getElementById('login-form').classList.toggle('hidden', showSignup);
        document.getElementById('signup-form').classList.toggle('hidden', !showSignup);
    }

    function logoutIdentity() {
        if (confirm("Se déconnecter ?")) {
            localStorage.removeItem('StellantisUser');
            location.reload();
        }
    }
        
    function ajouterManuellement() {
        const input = document.getElementById('input-vis');
        input.value = "";
        document.getElementById('modal-saisie').classList.remove('hidden');
        input.focus();
    }

    function fermerSaisie() { document.getElementById('modal-saisie').classList.add('hidden'); }

    function toggleSearch() {
        const bar = document.getElementById('search-bar');
        const input = document.getElementById('search-input');
        const isHidden = bar.classList.contains('hidden');
        
        if (isHidden) {
            bar.classList.remove('hidden');
            setTimeout(() => input.focus(), 100);
        } else {
            bar.classList.add('hidden');
            input.value = '';
            renderTable();
        }
    }

    function filtrerEnTempsReel(query) {
        const q = query.trim().toUpperCase();
        if (!q) { renderTable(); return; }

        document.getElementById('history-body').innerHTML = logs.map(log => {
            const isMatch = log.code.includes(q) || log.zone.includes(q) || log.op.includes(q);
            return `
            <tr class="border-b border-zinc-800" id="row-${log.id}" style="${isMatch ? 'background:rgba(234,234,0,0.25); box-shadow:inset 0 0 0 3px #eaea00;' : 'opacity:0.3'}">
                <td class="p-3 text-[16px]" style="color:${isMatch ? '#eaea00' : 'rgba(255,255,255,0.3)'}">${log.op}</td>
                <td class="p-3 border-r border-zinc-800">
                    <div class="editable-cell font-black" style="text-transform:uppercase; color:${isMatch ? '#ffffff' : '#eaea00'}" contenteditable="true" onblur="updateEntry(${log.id}, 'code', this.innerText)">${log.code}</div>
                </td>
                <td class="p-3 border-r border-zinc-800">
                    <div class="editable-cell text-white font-bold" style="text-transform:uppercase" contenteditable="true" onblur="updateEntry(${log.id}, 'zone', this.innerText)">${log.zone}</div>
                </td>
                <td class="p-3 text-[16px] font-black leading-none">${log.time}<br><span class="text-[12px]" style="${log.synced ? 'color:#ff0000;font-weight:900' : 'color:rgba(255,255,255,0.2)'}">${log.synced ? 'SUCCESS ✅' : log.date}</span></td>
                <td class="p-1"><button onclick="deleteEntry(${log.id})" class="btn-delete">Action</button></td>
            </tr>`;
        }).join('');
    }    

    function validerSaisie() {
        const input = document.getElementById('input-vis');
        const codeClean = input.value.trim().toUpperCase();
        if (/^[A-Z][0-9]{7}$/.test(codeClean)) {
            playScanSound();
            addLogEntry(codeClean);
            fermerSaisie();
        } else { alert("Format invalide ! (Ex: T5071035)"); }
    }

    document.getElementById('input-vis').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') validerSaisie();
    });

    function addLogEntry(codeValue) {

let user = { id: 'TEMP' };

try {

    const userData =
        localStorage.getItem('StellantisUser');

    if (userData) {
        user = JSON.parse(userData);
    }

} catch(e) {}

const now = new Date();

const uniqueScanId =
    (typeof crypto !== 'undefined'
    && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'scan-' + Date.now() + '-' +
      Math.random().toString(36).slice(2,11);

const entry = {

    id: Date.now(),

    scan_id: uniqueScanId,

    op: user.id,

    code: codeValue,

    zone: '',

    date: now.toLocaleDateString(
        'fr-FR',
        {
            day:'2-digit',
            month:'2-digit',
            year:'2-digit'
        }
    ),

    time: now.toLocaleTimeString(
        'fr-FR',
        {
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit'
        }
    ),

    synced: false
};

logs.unshift(entry);

localStorage.setItem(
    'lumen_logs',
    JSON.stringify(logs)
);

// IMPORTANT
renderTable();

setTimeout(() => {

    isProcessing = false;

    fermerSaisie();

    toggleView('history');

}, 300);

}

    async function sendToGoogle(entry) {
        if (!navigator.onLine) return false;
        const url = `${GOOGLE_URL}?action=saveScan&op=${encodeURIComponent(entry.op)}&code=${encodeURIComponent(entry.code)}&zone=${encodeURIComponent(entry.zone)}&date=${encodeURIComponent(entry.date)}&time=${encodeURIComponent(entry.time)}`;
        try {
            const response = await fetch(url);
            if (response.ok) {
                const idx = logs.findIndex(l => l.id === entry.id);
                if (idx !== -1) { logs[idx].synced = true; localStorage.setItem('lumen_logs', JSON.stringify(logs)); }
                renderTable();
                return true;
            }
        } catch(e) { console.error(e); }
        return false;
    }

    async function syncAllLogs() {
    if (!navigator.onLine) return alert("Vous êtes hors-ligne.");
    
    // 1. Forcer la synchro Supabase
    if (typeof syncPendingScansToSupabase === 'function') {
        try {
            await syncPendingScansToSupabase();
        } catch(e) {
            console.error("Erreur synchro Supabase:", e);
        }
    }
    
    // 2. Forcer la synchro Google Sheets
    const nonSynced = logs.filter(l => !l.synced);
    let count = 0;
    
    if (nonSynced.length > 0) {
        for (const log of nonSynced) { 
            const success = await sendToGoogle(log);
            if (success) count++; 
        }
        alert(`Synchronisé Google Sheets : ${count} ligne(s). Supabase actualisé.`);
    } else {
        alert("Google Sheets déjà à jour. File d'attente Supabase traitée.");
    }
}

   async function updateEntry(id, field, val) {

const i = logs.findIndex(l => l.id === id);

if (i === -1) return;

logs[i][field] = val.trim().toUpperCase();

localStorage.setItem(
    'lumen_logs',
    JSON.stringify(logs)
);

// IMPORTANT :
// PAS de renderTable() ici

// Sync uniquement après quitter zone

if (
    field === 'zone'
    &&
    logs[i].zone.trim().length >= 1
) {

    try {

        // Google Sheets
        await sendToGoogle(logs[i]);

        // Supabase
        if (
            typeof sendToSupabase === 'function'
        ) {

            await sendToSupabase(logs[i]);
        }

        logs[i].synced = true;

        localStorage.setItem(
            'lumen_logs',
            JSON.stringify(logs)
        );

        // Render uniquement après sync
        renderTable();

    } catch(err) {

        console.error(
            "Erreur sync:",
            err
        );
    }
}

}

    function renderTable() {
        document.getElementById('flux-title').innerText = `Flux (${logs.length})`;
        document.getElementById('history-body').innerHTML = logs.map(log => `
            <tr class="border-b border-zinc-800 ${log.synced ? 'sync-row' : ''}">
                <td class="p-3 text-white/30 text-[14px]">${log.op}</td>
                <td class="p-3 border-r border-zinc-800"><div class="editable-cell text-primary text-[20px] font-black" contenteditable="true" onblur="updateEntry(${log.id}, 'code', this.innerText)">${log.code}</div></td>
                <td class="p-3 border-r border-zinc-800"><div class="editable-cell text-white font-bold" contenteditable="true" onblur="updateEntry(${log.id}, 'zone', this.innerText)">${log.zone}</div></td>
               <td class="p-3 text-[16px] font-black leading-none">${log.time}<br><span class="text-[12px]" style="${log.synced ? 'color:#ff0000;font-weight:900' : 'color:rgba(255,255,255,0.2)'}">${log.synced ? 'SUCCESS ✅' : log.date}</span></td>
                <td class="p-1"><button onclick="deleteEntry(${log.id})" class="btn-delete">×</button></td>
            </tr>
        `).join('');
    }

    function playScanSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function toggleView(v) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => { b.classList.add('text-muted'); b.classList.remove('active-nav'); });
        document.getElementById(`view-${v}`).classList.remove('hidden');
        document.getElementById(`nav-${v}`).classList.add('active-nav');
        
        if (v === 'scanner') {
            startLibraryScanner();
        } else {
            stopLibraryScanner();
        }
    }

    function deleteEntry(id) {
        if (confirm("Supprimer ?")) { logs = logs.filter(l => l.id !== id); localStorage.setItem('lumen_logs', JSON.stringify(logs)); renderTable(); }
    }

    function exportCSV() {
        if (logs.length === 0) return alert("Aucune donnée.");
        let csv = "OP;CODE VIS;ZONE;DATE;HEURE;STATUT\n";
        logs.forEach(l => csv += `${l.op};${l.code};${l.zone};${l.date};${l.time};${l.synced?'ENVOYÉ':'ATTENTE'}\n`);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.download = `STELLANTIS_MGV.csv`; link.click();
    }
</script>
