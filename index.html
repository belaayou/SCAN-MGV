<style>

/* ============================= /
/ RESET GLOBAL & UTILS /
/ ============================= */

* {
box-sizing: border-box;
-webkit-text-size-adjust: none;
text-size-adjust: none;
}


html {
font-size: clamp(12px, 2.5vw, 16px);
}

body {
margin: 0;
padding: 0;
background: #000;
color: #fff;
font-family: 'Inter', sans-serif;
height: 100dvh;
overflow: hidden;
}

.hidden { display: none !important; }
.text-white { color: #ffffff; }
.text-primary { color: #eaea00; }
.text-red { color: #dc2626; }
.text-muted { color: rgba(255, 255, 255, 0.2) !important; }
.mb-1 { margin-bottom: 4px; }

@media screen and (orientation: landscape) {
html {
transform: rotate(-90deg);
transform-origin: left top;
width: 100vh;
height: 100vw;
overflow-x: hidden;
position: absolute;
top: 100%;
left: 0;
}
}

#app-container {
width: 100%;
height: 100dvh;
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
}

main {
flex: 1;
display: flex;
flex-direction: column;
overflow: hidden;
position: relative;
}

header {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 85px;
padding: 0 24px;
padding-top: env(safe-area-inset-top, 0px);
display: flex;
align-items: center;
justify-content: space-between;
background: #000;
border-bottom: 2px solid #18181b;
z-index: 1000;
}

.header-left { width: 33.333%; display: flex; flex-direction: column; justify-content: center; }
.header-center { width: 33.333%; display: flex; justify-content: center; align-items: center; gap: 16px; }
.header-right { width: 33.333%; display: flex; justify-content: end; align-items: center; }

.user-name { font-size: clamp(9px, 2.5vw, 12px); font-weight: 900; letter-spacing: 0.1em; color: #eaea00; text-transform: uppercase; line-height: 1.2; }
.user-id { font-size: clamp(12px, 3.5vw, 16px); font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.8); font-weight: bold; }

#stellantis-btn {
position: fixed;
bottom: 85px;
left: 0;
width: 100%;
padding: 8px 32px;
background: #000;
border-top: 1px solid rgba(24, 24, 27, 0.5);
z-index: 999;
}

.footer-brand-btn {
width: 100%;
background: #eaea00;
color: #000;
padding: 24px 0;
display: flex;
align-items: center;
justify-content: center;
gap: 16px;
border-radius: 16px;
border: none;
cursor: default;
box-shadow: 0 10px 20px rgba(234, 234, 0, 0.15);
}

.brand-text { font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.25rem; color: #000; }

nav {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 85px;
padding-bottom: env(safe-area-inset-bottom, 0px);
display: flex;
justify-content: space-around;
align-items: stretch;
background: #000;
border-top: 2px solid #18181b;
z-index: 1000;
}

.nav-item {
background: none;
border: none;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 0;
width: 50%;
height: 100%;
cursor: pointer;
}
.nav-text { font-size: clamp(10px, 2.5vw, 13px); font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
.active-nav { color: #eaea00 !important; border-top: 3px solid #eaea00; }

.view-section {
position: fixed;
top: 85px;
bottom: 185px;
left: 0;
width: 100%;
overflow: hidden;
}

#view-scanner {
position: absolute !important;
inset: 0 !important;
width: 100% !important;
height: 100% !important;
overflow: hidden;
background: #000 !important;
}
.camera-container {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
background: transparent !important;
z-index: 1;
}

#webcam,
#webcam video{
position:absolute;
inset:0;
width:100%;
height:90% !important;
object-fit:cover;
}

.scan-overlay {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 20;
display: flex;
align-items: center;
justify-content: center;
background: transparent !important;
}

.scan-frame {
position: relative;
width: 85%;
height: 530px;
border: 0px solid rgba(5, 150, 105, 0.3);
background: transparent;
}

.scan-area {
position: absolute;
inset: 0;
overflow: hidden;
}

.corner {
position: absolute;
width: 24px;
height: 24px;
border: 3px solid #ffffff;
z-index: 10;
}

.top-l {
top: -3px;
left: -3px;
border-right: none;
border-bottom: none;
}

.top-r {
top: -3px;
right: -3px;
border-left: none;
border-bottom: none;
}

.bot-l {
bottom: 93px;
left: -3px;
border-right: none;
border-top: none;
}

.bot-r {
bottom: 93px;
right: -3px;
border-left: none;
border-top: none;
}

.scan-line {
position: absolute;
left: 0;
width: 100%;
height: 3px;
background: #ffee00;
box-shadow:
0 0 8px #ffee00,
0 0 16px #ffee00,
0 0 24px #ffee00;
animation: laserMove 3s ease-in-out alternate infinite;
}

.scan-line::before,
.scan-line::after {
content: "";
position: absolute;
top: 50%;
transform: translateY(-50%);
width: 6px;
height: 6px;
background: #ffffff;
border-radius: 50%;
box-shadow:
0 0 12px #ffee00,
0 0 24px #ffee00,
0 0 36px #ffee00;
}
.scan-line::before { left: -2px; }
.scan-line::after { right: -2px; }

@keyframes laserMove {
0% {
top: 0px;
}
100% {
top: calc(82% - 6px);
}
}

#view-history {
overflow-y: auto !important;
overflow-x: hidden !important;
-webkit-overflow-scrolling: touch !important;
padding: 8px;
}

.table-toolbar {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 16px;
padding: 0 8px;
}

@media (min-width: 360px) {
.table-toolbar {
flex-direction: row;
justify-content: space-between;
align-items: center;
}
}

.toolbar-left { display: flex; align-items: center; gap: 12px; }
.toolbar-right { display: flex; gap: 6px; flex-wrap: wrap; }

.flux-indicator { color: #eaea00; font-weight: 900; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; font-style: italic; margin: 0; }

.btn-action {
border: none;
padding: 6px 14px;
font-weight: 900;
font-size: 13px;
text-transform: uppercase;
font-style: italic;
border-radius: 6px;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 6px;
color: #000000 !important;
transition: transform 0.1s, background-color 0.2s;
}
.btn-action:active { transform: scale(0.95); }

.btn-yellow { background: #eaea00; }
.btn-yellow:active { background: #c4c400; }
.btn-blue { background: #3b82f6; }
.btn-blue:active { background: #2563eb; }
.btn-emerald { background: #10b981; }
.btn-emerald:active { background: #059669; }
.btn-zinc { background: #a1a1aa; }
.btn-zinc:active { background: #71717a; }

.search-container { padding: 0 12px; margin-bottom: 12px; }
.search-field { width: 100%; background: #27272a; border: 2px solid #3f3f46; border-radius: 12px; padding: 12px 16px; color: #fff; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; outline: none; font-size: 18px; text-align: center; transition: border-color 0.2s; }
.search-field:focus { border-color: #eaea00; }

.table-responsive { background: #111113; border-radius: 12px; overflow-x: auto; border: 2px solid #18181b; max-height: calc(100% - 100px); }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }

.data-table th {
font-size: clamp(11px, 3vw, 14px);
padding: 10px 8px;
text-transform: uppercase;
font-weight: 900;
color: rgba(255,255,255,0.4);
background: #27272a;
position: sticky;
top: 0;
z-index: 10;
text-align: center;
}
.data-table tbody { font-family: 'JetBrains Mono', monospace; }

.data-table td {
vertical-align: middle;
padding: 12px 8px !important;
border-bottom: 2px solid #18181b !important;
text-align: center;
}

.data-table td:first-child, .data-table th:first-child { position: sticky; left: 0; background: #18181b; z-index: 5; border-right: 2px solid #27272a; }
.data-table th:first-child { z-index: 15; background: #27272a; }

.cell-op {
color: rgba(255, 255, 255, 0.3) !important;
font-size: 16px !important;
font-weight: 700;
text-align: center;
text-transform: uppercase;
}

.code-text {
font-size: 20px !important;
font-weight: 900 !important;
letter-spacing: 0.05em;
text-align: center;
text-transform: uppercase;
}

.zone-text {
font-size: 16px !important;
font-weight: 700 !important;
text-align: center;
text-transform: uppercase;
}

.cell-time {
text-align: center;
display: inline-flex;
flex-direction: column;
align-items: center;
justify-content: center;
line-height: 1.3;
}

.time-display {
font-size: 16px !important;
font-weight: 900 !important;
color: #ffffff;
}

.status-success {
font-size: 11px !important;
font-weight: 800 !important;
color: #22c55e !important;
text-transform: uppercase;
letter-spacing: 0.05em;
}

.status-date {
font-size: 11px !important;
color: rgba(255, 255, 255, 0.2) !important;
}

.sync-row { background: rgba(16, 185, 129, 0.02); }

.editable-cell {
padding: 6px 12px;
border-radius: 6px;
transition: all 0.15s ease;
display: inline-block;
width: 100%;
border: 2px solid transparent;
text-align: center;
}

.editable-cell:focus {
outline: none;
background: rgba(255, 68, 68, 0.05);
border: 2px solid #ef4444;
}

.cell-delete {
width: 50px;
text-align: center;
}
.btn-delete {
background: none;
border: none;
width: 36px;
height: 36px;
display: inline-flex;
align-items: center;
justify-content: center;
color: rgba(239, 68, 68, 0.3);
font-size: 24px;
font-weight: bold;
border-radius: 50%;
cursor: pointer;
transition: color 0.2s;
margin: 0 auto;
}
.btn-delete:active { background: rgba(239, 68, 68, 0.2); }
.btn-delete:hover { color: #ef4444; }

.torch-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#18181b;
color:#ffffff;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.25s;
}

.torch-btn:active{
transform:scale(.92);
}

.torch-btn.on{
background:#ffee00;
color:#000;
box-shadow:
0 0 12px #ffee00,
0 0 24px #ffee00,
0 0 45px #ffee00;
}

.auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; padding: 32px; display: flex; align-items: center; justify-content: center; }
.auth-box { width: 100%; max-width: 320px; text-align: center; }
.brand-title { color: #eaea00; font-weight: 900; font-size: 2.25rem; letter-spacing: -0.05em; margin-bottom: 8px; text-transform: uppercase; font-style: italic; }
.sub-title { color: #71717a; font-weight: bold; font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 32px; text-transform: uppercase; }
.form-group { display: flex; flex-direction: column; gap: 16px; }

.input-field { width: 100%; background: #18181b; border: 2px solid #27272a; padding: 16px; border-radius: 12px; outline: none; color: #fff; font-weight: bold; text-align: center; font-size: 1.25rem; transition: border-color 0.2s; }
.input-field:focus { border-color: #eaea00; }
.main-input { text-transform: uppercase; font-size: 1.5rem; padding: 20px; }

.btn-primary { width: 100%; margin-top: 16px; background: #eaea00; color: #000; font-weight: 900; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; }
.main-btn { padding: 24px 0; letter-spacing: 0.1em; font-size: 1.125rem; }
.link-btn { background: none; border: none; color: #71717a; text-decoration: underline; font-size: 1.125rem; text-transform: uppercase; font-weight: bold; margin-top: 16px; cursor: pointer; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: start; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal-content { background: #18181b; border: 2px solid #eaea00; border-radius: 32px; width: 100%; max-width: 280px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin-top: 10%; }
.modal-body { padding: 24px; }
.modal-title { color: #eaea00; font-size: 1.125rem; font-weight: 900; margin-bottom: 24px; letter-spacing: 0.05em; text-transform: uppercase; font-style: italic; text-align: center; }
.modal-input-container { position: relative; margin-bottom: 32px; }
.modal-input { width: 100%; background: #000; border: 2px solid #3f3f46; border-radius: 12px; padding: 20px 16px; font-size: 1.875rem; color: #fff; outline: none; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; text-align: center; }
.modal-input:focus { border-color: #eaea00; }
.modal-footer { display: flex; gap: 12px; height: 64px; }
.btn-modal-cancel { flex: 1; background: #27272a; color: #a1a1aa; border: none; font-size: 14px; font-weight: bold; border-radius: 12px; text-transform: uppercase; cursor: pointer; }
.btn-modal-confirm { flex: 1; background: #eaea00; color: #000; border: none; font-size: 14px; font-weight: bold; border-radius: 12px; text-transform: uppercase; cursor: pointer; }

.icon-btn { background: none; border: none; padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.icon-btn:active { background: #27272a; }
.icon-m { width: clamp(32px, 6vw, 36px); height: clamp(32px, 8vw, 38px); }
.icon-l { width: clamp(40px, 10vw, 48px); height: clamp(40px, 10vw, 48px); }
.text-scale { transition: transform 0.2s; }
.text-scale:hover { transform: scale(1.1); }

#debug-panel {
position: fixed;
top: 85px;
right: 0;
width: 280px;
max-height: 60vh;
overflow-y: auto;
background: rgba(0,0,0,0.92);
border: 1px solid #333;
border-radius: 0 0 0 12px;
z-index: 9999;
font-family: 'JetBrains Mono', monospace;
font-size: 10px;
color: #eaea00;
padding: 12px;
display: none;
}
#debug-panel.active { display: block; }
.debug-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.debug-label { color: #71717a; }
.debug-val { color: #eaea00; font-weight: 800; }
.debug-error { color: #ef4444; }
.debug-section { border-top: 1px solid #333; margin-top: 8px; padding-top: 8px; font-weight: 900; color: #fff; text-transform: uppercase; font-size: 11px; }

@media (min-width: 768px) {
#app-container, header, nav, #stellantis-btn, .view-section { max-width: 500px; left: 50%; transform: translateX(-50%); }
header { left: 50%; transform: translateX(-50%); }
}
</style>

</head>  
<body>  
<div id="app-container">   
    <div id="identity-screen" class="auth-screen">  
        <div class="auth-box">  
            <h1 class="brand-title">STELLANTIS</h1>  
            <p id="auth-title" class="sub-title">Connexion Terminal</p>  <div id="login-form" class="form-group">  
            <input type="text" id="login-id"   
                autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"  
                class="input-field main-input"  
                placeholder="ID MATRICULE">  
           <input type="password" id="login-pass" autocomplete="new-password"  
                class="input-field main-input"  
                placeholder="MOT DE PASSE">                 
            <button onclick="login()" class="btn-primary main-btn">Se Connecter</button>  
            <button onclick="toggleAuth(true)" class="link-btn">Creer un compte</button>  
        </div>  

        <div id="signup-form" class="form-group hidden">  
            <input type="text" id="reg-nom" class="input-field" placeholder="NOM">  
            <input type="text" id="reg-prenom" class="input-field" placeholder="PRENOM">  
            <input type="text" id="reg-id" class="input-field" placeholder="ID MATRICULE">

<select id="reg-equipe" class="input-field">  
                    <option value="" disabled selected>EQUIPE</option>  
                    <option value="A">Equipe A</option>  
                    <option value="B">Equipe B</option>  
                     <option value="C">Equipe C</option>  
                     <option value="FER/A">Equipe FER/A</option>  
                      <option value="FER/B">Equipe Fer/B</option> 
                       <option value="FER/C">Equipe FER/C</option>  
                </select>  
                <input type="password" id="reg-pass" class="input-field" placeholder="MOT DE PASSE">             
                <button onclick="register()" class="btn-primary main-btn">Valider</button>  
                <button onclick="toggleAuth(false)" class="link-btn">Retour</button>  
            </div>  
        </div>  
    </div>  <header>  
    <div class="header-left">  
        <span id="display-name" class="user-name">---</span>  
        <span id="display-id" class="user-id">ID: ---</span>  
    </div>  
    <div class="header-center">  
        <button onclick="toggleTorch()" id="torch-btn" class="icon-btn torch-btn">  
            🔦  
        </button>  
        <button onclick="toggleView('scanner')" class="icon-btn text-primary text-scale">  
            <svg class="icon-l" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h3m-3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>  
        </button>  
    </div>  
    <div class="header-right">  
        <button onclick="logoutIdentity()" class="icon-btn text-red">  
             <svg class="icon-m" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>  
        </button>  
    </div>  
</header>  

<main>  
     <section id="view-scanner" class="view-section">  
        <div class="camera-container">  
            <div id="webcam"></div>  
        </div>  

        <div class="scan-overlay">  
            <div class="scan-frame">  
                <div class="corner top-l"></div>  
                <div class="corner top-r"></div>  
                <div class="corner bot-l"></div>  
                <div class="corner bot-r"></div>  

                <div class="scan-line"></div>  
            </div>  
        </div>  
    </section>  

    <section id="view-history" class="view-section hidden">  
        <div class="table-toolbar">  
            <div class="toolbar-left">  
                <h3 id="flux-title" class="flux-indicator">Flux (0)</h3>  
            </div>  
            <div class="toolbar-right">  
                <button onclick="toggleSearch()" id="search-btn" class="btn-action btn-yellow">  
                    <svg style="width:14px; height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">  
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>  
                    </svg>  
                    Chercher  
                </button>  
                <button onclick="ajouterManuellement()" class="btn-action btn-blue">+ Manuel</button>  
                <button onclick="syncAllLogs()" class="btn-action btn-emerald">Actualiser</button>  
                <button onclick="exportCSV()" class="btn-action btn-zinc">CSV</button>  
            </div>  
        </div>  

        <div id="search-bar" class="hidden search-container">  
            <input type="text" id="search-input"  
                   placeholder="RECHERCHER UN VIS..."

                   class="search-field">

        <div class="table-responsive">

                    </tr>  
                    </tr>  
                </thead>  
                <tbody id="history-body"></tbody>  
            </table>  
        </div>  
    </section>  

    <div id="stellantis-btn">  
        <button class="footer-brand-btn" style="cursor: pointer;">  
            <svg class="icon-m" fill="currentColor" viewBox="0 0 24 24"><path d="M3 4h2v16H3V4zm4 0h1v16H7V4zm3 0h3v16h-3V4zm5 0h2v16h-2V4zm4 0h2v16h-2V4zm4 0h2v16h-2V4z"/></svg>  
            <span class="brand-text">STELLANTIS MGV</span>  
        </button>  
    </div>  
</main>  

<nav>  
    <button onclick="toggleView('scanner')" id="nav-scanner" class="nav-item active-nav">  
        <svg class="icon-m mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h3m-3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

async function startNativeCamera() {
if (AppState.isCameraOperating || AppState.isTransitioning) return;

AppState.isTransitioning = true;  
AppState.isCameraOperating = true;  

try {  
    await clearAllResources();  

    AppState.decoderInstance = new Html5Qrcode("webcam");  
    AppState.diag.h5qInstances = 1;  

    const config = {  
        fps: 15,  
        qrbox: (width, height) => {  
            return { width: width * 0.85, height: 340 };   
        },  
        aspectRatio: 1.777778  
    };  

    await AppState.decoderInstance.start(  
        { facingMode: 'environment' },  
        config,  
        (decodedText) => {  
            onBarcodeDetected(decodedText);  
        },  
        (errorMessage) => {  
            AppState.scanLocked = false;  
        }  
    );  

    setTimeout(() => {  
        try {  
            const videoEl = document.querySelector('#webcam video');  
            if (videoEl && videoEl.srcObject) {  
                AppState.mediaStream = videoEl.srcObject;  
                const tracks = AppState.mediaStream.getVideoTracks();  
                if (tracks.length > 0) {  
                    AppState.torchTrack = tracks[0];  

                    if (AppState.torchPreferredOn) {  
                        AppState.torchTrack.applyConstraints({ advanced: [{ torch: true }] })  
                            .then(() => {  
                                AppState.torchActive = true;  
                                const torchBtnEl = document.getElementById('torch-btn');  
                                if (torchBtnEl) torchBtnEl.classList.add('on');  
                            })  
                            .catch((e) => {  
                                AppState.torchActive = false;  
                                AppState.torchPreferredOn = false;  
                                logError('Torch restore: ' + e.message);  
                            });  
                    }  
                }  
            }  
        } catch (e) {  
            console.log("[SCANNER] Torche indisponible.");  
        }  
    }, 1000);  

} catch(err) {  
    logError('Camera native boot: ' + err.message);  
    await clearAllResources();  
} finally {  
    AppState.isTransitioning = false;  
    updateDebugPanel();  
}

}

function onBarcodeDetected(code) {
if (AppState.scanLocked) return;

const cleanCode = code.trim().toUpperCase();  
if (!/^[A-Z][0-9]{7}$/.test(cleanCode)) return;  

AppState.scanLocked = true;  
playScanSound();  

addLogEntry(cleanCode);  

setTimeout(() => {  
    AppState.scanLocked = false;  
}, 1500);

}
    
function playScanSound() {
try {
if (!AppState.audioCtx) {
AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
const osc = AppState.audioCtx.createOscillator();
const gain = AppState.audioCtx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(880, AppState.audioCtx.currentTime);
gain.gain.setValueAtTime(0.05, AppState.audioCtx.currentTime);
osc.connect(gain);
gain.connect(AppState.audioCtx.destination);
osc.start();
osc.stop(AppState.audioCtx.currentTime + 0.1);
} catch(e) {
logError('Audio: ' + e.message);
}
}

function nettoyerAnciennesDonnees7Jours() {
const NB_JOURS_MAX = 7;
const maintenant = Date.now();
const septJoursEnMs = NB_JOURS_MAX * 24 * 60 * 60 * 1000;

AppState.logs = AppState.logs.filter(log => {  
    if (!log.synced) return true;  
    const logTime = Number(log.id) || maintenant;  
    return (maintenant - logTime) < septJoursEnMs;  
});

}

async function validateAndSendZone(id, val) {
const zoneValue = val.trim().toUpperCase();
const i = AppState.logs.findIndex(l => l.id === id);

if (i === -1 || !zoneValue) return;  

AppState.logs[i].zone = zoneValue;  
AppState.logs[i].synced = false;  
localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));  

const success = await sendToSupabase(AppState.logs[i]);

    async function sendToSupabase(entry) {
  if (!navigator.onLine) return false;

  console.log(`[SYNC-SEND] VIS = ${entry.code} | id = ${entry.id} | zone = ${entry.zone || '(vide)'} | synced = ${entry.synced}`);

  try {
    const { error } = await supabaseClient
      .from('SCAN_MGV_APP')
      .upsert([{
        id: entry.id,
        operator_id: entry.op,
        op: entry.op,
        equipe_id: entry.equipe_id,
        code: entry.code,
        zone: entry.zone,
        date: entry.date,
        time: entry.time
      }]);

    if (!error) {
      const idx = AppState.logs.findIndex(l => l.id === entry.id);
      if (idx !== -1) {
        AppState.logs[idx].synced = true;
        localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));
      }
      console.log(`[SYNC] VIS = ${entry.code} | id = ${entry.id} | ACTION = INSERT | STATUS = SUCCESS`);
      return true;
    }
    console.warn(`[SYNC] VIS = ${entry.code} | id = ${entry.id} | ACTION = INSERT | STATUS = ERREUR`, error.message);
    return false;
  } catch(e) {
    logError('Supabase sync: ' + e.message);
    return false;
  }
}

async function autoSyncPendingScans() {
  if (!navigator.onLine || _autoSyncInProgress) return;

  _autoSyncInProgress = true;
  console.log('[AUTO-SYNC] Tentative d\'auto-synchronisation...');

  try {
    const nonSynced = AppState.logs.filter(l => !l.synced);
    if (nonSynced.length === 0) {
      console.log('[AUTO-SYNC] Aucun scan en attente.');
      return;
    }

    console.log(`[AUTO-SYNC] Synchronisation automatique de ${nonSynced.length} élément(s)...`);
    
    for (const log of nonSynced) {
      await sendToSupabase(log);
    }
    
    renderTable();
  } catch (e) {
    logError('Auto-sync error: ' + e.message);
  } finally {
    _autoSyncInProgress = false;
  }
}

async function syncAllLogs() {
  if (!navigator.onLine) return alert("Vous êtes hors-ligne.");

  _autoSyncInProgress = true;

  try {
    await fetchLogsFromSupabase();
    const nonSynced = AppState.logs.filter(l => !l.synced);

    console.log(`[SYNC] Entrées en attente : ${nonSynced.length}`);
    nonSynced.forEach(l => console.log(`  → VIS = ${l.code} | id = ${l.id} | zone = ${l.zone || '(vide)'} | EXISTING_ACTIVE_RECORD = false | STATUS = pending_insert`));

    if (nonSynced.length === 0) {
      renderTable();
      return alert("Aucune donnée à synchroniser.");
    }

    const results = await Promise.all(nonSynced.map(log => sendToSupabase(log)));
    const count = results.filter(Boolean).length;
    alert(`Synchronisé : ${count} ligne(s).`);
  } finally {
    _autoSyncInProgress = false;
  }
}

async function updateEntry(id, field, val) {
const i = AppState.logs.findIndex(l => l.id === id);
if (i === -1) return;

const newVal = val.trim().toUpperCase();  
const oldVal = AppState.logs[i][field] || '';  

if (newVal === oldVal) return; 

AppState.logs[i][field] = newVal;  
localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));  

AppState.logs[i].synced = false;  
await sendToSupabase(AppState.logs[i]);  
renderTable();

}

const PENDING_DELETES_KEY = 'SCAN_MGV_APP_PENDING_DELETES';

function getPendingDeletes() {
try { return JSON.parse(localStorage.getItem(PENDING_DELETES_KEY) || '[]'); }
catch(e) { return []; }
}
function savePendingDeletes(list) {
localStorage.setItem(PENDING_DELETES_KEY, JSON.stringify(list));
}

function queuePendingDelete(id, deletedBy) {
const list = getPendingDeletes().filter(p => p.id !== id);
list.push({ id, deleted_by: deletedBy, deleted_at: new Date().toISOString() });
savePendingDeletes(list);
}

async function sendSoftDeleteToSupabase(id, deletedBy, deletedAt) {
try {
const { error } = await supabaseClient
.from('SCAN_MGV_APP')
.update({
is_deleted: true,
deleted_at: deletedAt,
deleted_by: deletedBy
})
.eq('id', id);
return !error;
} catch(e) {
logError('Soft delete: ' + e.message);
return false;
}
}

async function deleteEntry(id) {
  if (!confirm("Supprimer l'entrée ?")) return;

  let user = { id: 'TEMP' };
  try {
    const userData = localStorage.getItem('StellantisUser');
    if (userData) user = JSON.parse(userData);
  } catch(e) {}

  const deletedAt = new Date().toISOString();
  const deletedEntry = AppState.logs.find(l => l.id === id);

  console.log(`[DELETE] id = ${id} | VIS = ${deletedEntry?.code || '?'} | zone = ${deletedEntry?.zone || '?'} | LOCAL = en cours de suppression`);

  AppState.logs = AppState.logs.filter(l => l.id !== id);
  localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));
  renderTable();

  if (navigator.onLine) {
    const success = await sendSoftDeleteToSupabase(id, user.id, deletedAt);
    if (success) {
      console.log(`[DELETE] id = ${id} | VIS = ${deletedEntry?.code || '?'} | REMOTE = supprimé (is_deleted=true)`);
    } else {
      queuePendingDelete(id, user.id);
      console.log(`[DELETE] id = ${id} | VIS = ${deletedEntry?.code || '?'} | REMOTE = en attente (queue)`);
    }
  } else {
    queuePendingDelete(id, user.id);
    console.log(`[DELETE] id = ${id} | VIS = ${deletedEntry?.code || '?'} | REMOTE = en attente (hors-ligne)`);
  }
}

async function flushPendingDeletes() {
const pending = getPendingDeletes();
if (pending.length === 0) return;

const stillPending = [];  
for (const p of pending) {  
    const success = await sendSoftDeleteToSupabase(p.id, p.deleted_by, p.deleted_at);  
    if (!success) stillPending.push(p);  
}  
savePendingDeletes(stillPending);

}

window.addEventListener('online', async () => {
  AppState.isOnline = true;
  updateDebugPanel();
  console.log('[NETWORK] Connexion rétablie : lancement de la synchro automatique...');
  
  await flushPendingDeletes();
  await autoSyncPendingScans();
  await fetchLogsFromSupabase();
  
  nettoyerAnciennesDonnees7Jours();
  localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));
});

window.addEventListener('offline', () => {
  AppState.isOnline = false;
  updateDebugPanel();
  console.log('[NETWORK] Mode hors-ligne activé.');
});

function isEditingZone() {
const active = document.activeElement;
return !!(active && active.classList && active.classList.contains('zone-input'));
}

async function fetchLogsFromSupabase() {

if (!navigator.onLine) return;  

const user = JSON.parse(localStorage.getItem('StellantisUser'));  
if (!user) return;

const { data, error } = await supabaseClient  
    .from('SCAN_MGV_APP')  
    .select('*')  
    .eq('op', user.id)  
    .eq('is_deleted', false)  
    .order('id', { ascending:false });  

if (error) return console.error(error);  

const serverLogs = data.map(item => ({ ...item, synced: true }));  

const serverIds = new Set(serverLogs.map(l => l.id));  
const localPending = AppState.logs.filter(l => !l.synced && !serverIds.has(l.id));  

AppState.logs = [...localPending, ...serverLogs].sort((a, b) => b.id - a.id);  

nettoyerAnciennesDonnees7Jours();  

localStorage.setItem(  
    'SCAN_MGV_APP',  
    JSON.stringify(AppState.logs)  
);  

renderTable();

}

function renderTable() {
const titleEl = document.getElementById('flux-title');
if (titleEl) titleEl.innerText = `Flux (${AppState.logs.length})`;

const historyBody = document.getElementById('history-body');  
if (!historyBody) return;  

historyBody.innerHTML = AppState.logs.map(log => {  
    const statusText = log.synced ? 'SUCCESS' : log.date;  
    const statusClass = log.synced ? 'status-success' : 'status-date';  
    const rowClass = log.synced ? 'sync-row' : '';  

    return `  
        <tr id="row-${log.id}" class="${rowClass}">  
            <td class="cell-op">${log.op}${log.equipe_id ? '/' + log.equipe_id : ''}</td>  
            <td class="cell-code">  
                <div class="editable-cell text-primary code-text" contenteditable="true" onblur="updateEntry(${log.id}, 'code', this.innerText)">${log.code}</div>  
            </td>  
            <td class="cell-zone">  
                <div class="editable-cell text-white zone-text zone-input" contenteditable="true" onblur="validateAndSendZone(${log.id}, this.innerText)" onkeypress="if(event.key === 'Enter'){ event.preventDefault(); this.blur(); }">${log.zone}</div>  
            </td>  
            <td class="cell-time">  
                <div class="time-display">${log.time}</div>  
                <div class="${statusClass}">${statusText}${log.synced ? ' &#10003;' : ''}</div>  
            </td>  
            <td class="cell-delete">  
                <button onclick="deleteEntry(${log.id})" class="btn-delete">&times;</button>  
            </td>  
        </tr>  
    `;  
}).join('');

}

function filtrerEnTempsReel(query) {
const q = query.trim().toUpperCase();
if (!q) { renderTable(); return; }

const historyBody = document.getElementById('history-body');  
historyBody.innerHTML = AppState.logs.map(log => {  
    const isMatch = log.code.includes(q) || (log.zone || '').includes(q) || log.op.includes(q);  
    const statusText = log.synced ? 'SUCCESS' : log.date;  
    const statusClass = log.synced ? 'status-success' : 'status-date';  

    return `  
    <tr id="row-${log.id}" style="${isMatch ? 'background:rgba(234,234,0,0.25);' : 'opacity:0.3'}">  
        <td class="cell-op">${log.op}${log.equipe_id ? '/' + log.equipe_id : ''}</td>  
        <td><div class="editable-cell code-text text-primary" contenteditable="true" onblur="updateEntry(${log.id}, 'code', this.innerText)">${log.code}</div></td>  
        <td><div class="zone-input editable-cell zone-text text-white" contenteditable="true" onblur="validateAndSendZone(${log.id}, this.innerText)" onkeypress="if(event.key === 'Enter'){ event.preventDefault(); this.blur(); }">${log.zone}</div></td>  
        <td class="cell-time"><div class="time-display">${log.time}</div><div class="${statusClass}">${statusText}</div></td>  
        <td class="cell-delete"><button onclick="deleteEntry(${log.id})" class="btn-delete">&times;</button></td>  
    </tr>`;  
}).join('');

}

function toggleView(v) {
if (AppState.isTransitioning) return;
AppState.currentView = v;

document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));  
document.querySelectorAll('nav button').forEach(b => {   
    b.classList.add('text-muted');   
    b.classList.remove('active-nav');   
});  

const targetView = document.getElementById(`view-${v}`);  
if(targetView) targetView.classList.remove('hidden');  

const targetNav = document.getElementById(`nav-${v}`);  
if(targetNav) targetNav.classList.add('active-nav');  

if (v === 'scanner') {  
    startNativeCamera();  
} else {  
    stopNativeCamera();  
}

}

function ajouterManuellement() {
const input = document.getElementById('input-vis');
input.value = "";
document.getElementById('modal-saisie').classList.remove('hidden');
setTimeout(() => input.focus(), 100);
}

function fermerSaisie() {
document.getElementById('modal-saisie').classList.add('hidden');
}

function validerSaisie() {
const input = document.getElementById('input-vis');
const codeClean = input.value.trim().toUpperCase();
if (/^[A-Z][0-9]{7}$/.test(codeClean)) {
playScanSound();
addLogEntry(codeClean);
fermerSaisie();
} else {
alert("Format invalide !");
}
}

function toggleSearch() {
const bar = document.getElementById('search-bar');
const input = document.getElementById('search-input');
if (bar.classList.contains('hidden')) {
bar.classList.remove('hidden');
setTimeout(() => input.focus(), 100);
} else {
bar.classList.add('hidden');
input.value = '';
renderTable();
}
}

function exportCSV() {
if (AppState.logs.length === 0) return alert("Aucune donnée.");
let csv = "OP;EQUIPE;CODE VIS;ZONE;DATE;HEURE;STATUT\n";
AppState.logs.forEach(l => {
csv += `${l.op};${l.equipe_id || ''};${l.code};${l.zone};${l.date};${l.time};${l.synced ? 'ENVOYE' : 'ATTENTE'}\n`;
});
const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
const link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = `STELLANTIS_MGV.csv`;
link.click();
}

document.addEventListener('visibilitychange', () => {
if (document.hidden) {
stopNativeCamera();
} else if (AppState.currentView === 'scanner') {
setTimeout(() => startNativeCamera(), 300);
}
});
async function logoutIdentity() {
if (confirm("Voulez-vous vous déconnecter du terminal ?")) {
await clearAllResources();
localStorage.removeItem('StellantisUser');
location.reload();
}
}

function buildFullOperatorId(id, equipeId) {
if (!id) return '';
return equipeId ? `${id}/${equipeId}` : `${id}`;
}

async function initApp() {
lockOrientation();

try {  
    const cached = JSON.parse(localStorage.getItem('SCAN_MGV_APP') || '[]');  
    if (Array.isArray(cached)) AppState.logs = cached;  
} catch (e) {}  
nettoyerAnciennesDonnees7Jours();  

const user = JSON.parse(localStorage.getItem('StellantisUser'));  
if (user) {  
    document.getElementById('identity-screen').classList.add('hidden');  
    document.getElementById('display-name').innerText = user.prenom + " " + user.nom;  
    document.getElementById('display-id').innerText = `ID: ${buildFullOperatorId(user.id, user.equipe_id)}`;  

    if (navigator.onLine) {
        await autoSyncPendingScans();
        await fetchLogsFromSupabase();  
    }
    renderTable();  
    startNativeCamera();  
} else if (!navigator.onLine) {  
    localStorage.setItem('StellantisUser', JSON.stringify({  
        id: 'TEMP', nom: 'HORS-LIGNE', prenom: 'MODE', equipe_id: ''  
    }));  
    document.getElementById('identity-screen').classList.add('hidden');  
    document.getElementById('display-name').innerText = "MODE HORS-LIGNE";  
    document.getElementById('display-id').innerText = "ID: TEMP";  
    renderTable();  
    startNativeCamera();  
}  

const realtimeFilter = (user && user.id) ? `op=eq.${user.id}` : undefined;  

supabaseClient  
    .channel('table-db-changes')  
    .on('postgres_changes', {  
        event: '*',  
        schema: 'public',  
        table: 'SCAN_MGV_APP',  
        ...(realtimeFilter ? { filter: realtimeFilter } : {})  
    }, (payload) => {  
        const rowOp = (payload.new && payload.new.op) || (payload.old && payload.old.op);  
        if (user && user.id && rowOp && rowOp !== user.id) return;  

        if (payload.eventType === 'INSERT') {  
            if (payload.new.is_deleted) return;  
            const exists = AppState.logs.some(l => l.id === payload.new.id);  
            if (!exists) AppState.logs.unshift({ ...payload.new, synced: true });  
        } else if (payload.eventType === 'UPDATE') {  
            if (payload.new.is_deleted) {  
                AppState.logs = AppState.logs.filter(l => l.id !== payload.new.id);  
            } else {  
                const index = AppState.logs.findIndex(l => l.id === payload.new.id);  
                if (index !== -1) AppState.logs[index] = { ...payload.new, synced: true };  
                else AppState.logs.unshift({ ...payload.new, synced: true });  
            }  
        } else if (payload.eventType === 'DELETE') {  
            AppState.logs = AppState.logs.filter(l => l.id !== payload.old.id);  
        }  
        localStorage.setItem('SCAN_MGV_APP', JSON.stringify(AppState.logs));  
        renderTable();  
    })  
    .subscribe();  

if (navigator.onLine) {  
    flushPendingDeletes();  
    autoSyncPendingScans();
}

}
initApp();

document.getElementById('stellantis-btn')?.addEventListener('click', () => {
toggleDebug();
});
